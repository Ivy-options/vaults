# Forge is used only for formatting; compilation and tests use Hardhat.
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "preserve"
single_line_statement_blocks = "multi"
wrap_comments = false
sort_imports = true
